- lvgl.dropdown.update:
    id: filament_type_dropdown
    selected_text: !lambda |-
      return id(box_${box_num}_filament_type).current_option();

- lvgl.slider.update:
    id: red_slider
    value: !lambda |-
      auto color = id(box_${box_num}_color).remote_values;
      return color.get_red() * color.get_color_brightness() * 255.0f;

- lvgl.slider.update:
    id: green_slider
    value: !lambda |-
      auto color = id(box_${box_num}_color).remote_values;
      return color.get_green() * color.get_color_brightness() * 255.0f;

- lvgl.slider.update:
    id: blue_slider
    value: !lambda |-
      auto color = id(box_${box_num}_color).remote_values;
      return color.get_blue() * color.get_color_brightness() * 255.0f;
